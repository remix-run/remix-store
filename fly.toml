app = "remix-store"
primary_region = "dfw"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
PORT = "44100"
TRUST_PROXY = "true"

[deploy]
strategy = "bluegreen"
wait_timeout = "10m"

# Machines run in dfw and ams; `fly deploy` keeps each region's Machines.
# min_machines_running only covers the primary region, so keep every region
# warm instead of cold-starting visitors outside dfw.
[http_service]
internal_port = 44100
force_https = true
auto_stop_machines = "off"
auto_start_machines = true

[[http_service.checks]]
grace_period = "20s"
interval = "30s"
method = "GET"
path = "/health"
timeout = "5s"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
