app = "remix-store"
primary_region = "dfw"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "44100"
  TRUST_PROXY = "true"

[deploy]
  strategy = "bluegreen"
  wait_timeout = "10m"

[http_service]
  internal_port = 44100
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
