saveExact: true
packageManagerStrict: true
minimumReleaseAge: 10800
minimumReleaseAgeExclude:
  - remix
  - "@remix-run/*"
  - "@shopify/*"
minimumReleaseAgeStrict: true
# Remix's git-hosted preview already contains built dist files, but its package
# lifecycle scripts otherwise try to prepare the fetched monorepo package.
ignoreScripts: true
onlyBuiltDependencies:
  - remix
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
