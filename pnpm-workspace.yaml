saveExact: true
packageManagerStrict: true
minimumReleaseAge: 10800
minimumReleaseAgeExclude:
  - remix
  - "@remix-run/*"
  - "@shopify/*"
  - "@pitlane/*"
minimumReleaseAgeStrict: true
# Remix's git-hosted preview already contains built dist files, but its package
# lifecycle scripts otherwise try to prepare the fetched monorepo package.
ignoreScripts: true
trustPolicy: no-downgrade
# Security floors for dev-only transitive dependencies of @shopify/mini-oxygen.
# Miniflare 4 pins undici 7.28.0, and body-parser 1.20.4 asks for qs ~6.14;
# both ranges resolve to releases with open advisories. Drop each override
# once its range resolves to a patched release on its own (check with
# `pnpm why <package>` and the GitHub advisory database, since `pnpm audit`
# does not work through Shopify's package proxy).
overrides:
  undici: 7.30.1
  qs: 6.16.2
