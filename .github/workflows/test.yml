name: 🧪 Test
on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run tests
        run: pnpm test

  e2e:
    name: 🎭 End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile

      - name: 🎭 Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 🔐 Configure local environment
        run: cp .env.example .env

      - name: 🎭 Run end-to-end tests
        run: pnpm test:e2e

  node-image:
    name: 🐳 Node image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🐳 Build production image
        run: >-
          docker build
          --build-arg ASSET_BUILD_ID="$GITHUB_SHA"
          --tag remix-store-fly:test
          .

      - name: 🔬 Verify production image
        run: |
          container=remix-store-fly-test
          trap 'docker logs "$container"; docker rm --force "$container"' EXIT
          docker run --detach --name "$container" \
            --env-file .env.example \
            --publish 44100:44100 \
            remix-store-fly:test

          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:44100/health | grep --quiet '^OK$'; then
              ready=true
              break
            fi
            sleep 1
          done
          [ "$ready" = true ]

          html=$(curl --fail --silent http://127.0.0.1:44100/)
          grep --fixed-strings --quiet "Remix Store" <<<"$html"
          curl --fail --silent --dump-header - --output /dev/null \
            --header 'Accept-Encoding: gzip' http://127.0.0.1:44100/ \
            | grep --ignore-case --quiet '^content-encoding: gzip'
          entry=$(grep --only-matching 'src="/assets/[^"]*"' <<<"$html" | head -1 | cut -d'"' -f2)
          curl --fail --silent --head "http://127.0.0.1:44100$entry" \
            | grep --ignore-case --quiet '^cache-control: public, max-age=31536000, immutable'
