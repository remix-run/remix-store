name: 🎭 Acceptance Tests

on:
  # Run nightly against production
  schedule:
    - cron: "0 6 * * *" # 6 AM UTC daily
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test against"
        required: false
        default: "https://shop.remix.run"
  # Run on PRs that modify acceptance tests
  pull_request:
    paths:
      - "acceptance/**"
      - "playwright.config.ts"
      - ".github/workflows/acceptance-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: 🎭 Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile

      - name: 🎭 Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: 🧪 Run acceptance tests
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://shop.remix.run' }}
        run: pnpm test:acceptance

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: 📸 Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7
